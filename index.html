<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-react-app</title>
    <style>
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus,
      .skip-link:active {
        left: 12px;
        top: 12px;
        width: auto;
        height: auto;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #e6e6e6;
        color: #333;
        z-index: 2000;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
